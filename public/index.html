<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expense Reports Autopilot</title><link rel="stylesheet" href="/styles.css"></head>
<body><header class="topbar"><a class="brand" href="/">Expense Reports</a><nav id="nav"></nav></header>
<main class="layout welcome">
  <section class="panel intro">
    <h1>Event expenses</h1>
    <p>Upload receipts for one event, review the reimbursement calculation, and prepare an email to Accounting.</p>
  </section>
  <section class="panel">
    <form id="login" hidden>
      <h2>Sign in</h2>
      <label>Work email<input type="email" name="email" autocomplete="username" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit">Sign in</button>
    </form>
    <form id="upload" hidden>
      <h2>Receipt photos</h2>
      <p class="muted">Upload one receipt per photo.</p>
      <label class="upload-zone">Choose files <span>JPEG or PNG</span><input name="receipts" type="file" accept="image/jpeg,image/png" multiple required></label>
      <ul id="files" class="file-list"></ul>
      <button type="submit">Start request</button>
    </form>
    <div id="review-entry" hidden><h2>Incoming requests</h2><a class="button" href="/approvals">Open dashboard</a></div>
    <p class="error" id="error" role="alert" hidden></p>
  </section>
</main><script type="module" src="/intake.js"></script></body></html>
